services:
  ai-service:
    build: ./ai-service
    ports:
      - "8000:8000"
    environment:
      # Runs fully offline by default. Supply the keys below to enable the
      # Gemini ReAct loop, live Agmarknet data and internet search.
      OFFLINE_MODE: "${OFFLINE_MODE:-1}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      AGMARKNET_API_KEY: "${AGMARKNET_API_KEY:-}"
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
      CORS_ORIGINS: "http://localhost:4000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  # The gateway serves the built frontend as well as the API, so the whole
  # product is one container on one port.
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      NODE_ENV: "development"
      AI_SERVICE_URL: "http://ai-service:8000"
      MONGO_URI: "${MONGO_URI:-}"
      JWT_SECRET: "${JWT_SECRET:-development-only-secret-change-me}"
      # WhatsApp delivery is off unless these are supplied.
      WHATSAPP_TOKEN: "${WHATSAPP_TOKEN:-}"
      WHATSAPP_PHONE_NUMBER_ID: "${WHATSAPP_PHONE_NUMBER_ID:-}"
      WHATSAPP_VERIFY_TOKEN: "${WHATSAPP_VERIFY_TOKEN:-}"
      WHATSAPP_APP_SECRET: "${WHATSAPP_APP_SECRET:-}"
    depends_on:
      ai-service:
        condition: service_healthy
